<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#080A09"/>
  <circle cx="400" cy="250" r="250" fill="#B6FF3B" fill-opacity="0.1" filter="blur(80px)"/>
  
  <!-- Gravitational field rings -->
  <circle cx="400" cy="250" r="70" stroke="#B6FF3B" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="8 6"/>
  <circle cx="400" cy="250" r="140" stroke="#B6FF3B" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="10 8"/>
  <circle cx="400" cy="250" r="210" stroke="#B6FF3B" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="12 10"/>

  <!-- Swarm of dynamic nodes & connection lines -->
  <g stroke="#B6FF3B" stroke-opacity="0.25" stroke-width="1">
    <line x1="400" y1="250" x2="330" y2="180"/>
    <line x1="400" y1="250" x2="490" y2="190"/>
    <line x1="400" y1="250" x2="460" y2="330"/>
    <line x1="400" y1="250" x2="310" y2="300"/>
    <line x1="330" y1="180" x2="250" y2="140"/>
    <line x1="490" y1="190" x2="570" y2="160"/>
    <line x1="460" y1="330" x2="540" y2="380"/>
    <line x1="310" y1="300" x2="230" y2="360"/>
    <line x1="330" y1="180" x2="490" y2="190"/>
    <line x1="490" y1="190" x2="460" y2="330"/>
    <line x1="460" y1="330" x2="310" y2="300"/>
    <line x1="310" y1="300" x2="330" y2="180"/>
  </g>

  <!-- Glowing Nodes -->
  <circle cx="400" cy="250" r="10" fill="#B6FF3B"/>
  <circle cx="330" cy="180" r="6" fill="#B6FF3B"/>
  <circle cx="490" cy="190" r="7" fill="#B6FF3B"/>
  <circle cx="460" cy="330" r="5" fill="#B6FF3B"/>
  <circle cx="310" cy="300" r="6" fill="#B6FF3B"/>
  <circle cx="250" cy="140" r="4" fill="#E7FFB8"/>
  <circle cx="570" cy="160" r="5" fill="#E7FFB8"/>
  <circle cx="540" cy="380" r="4" fill="#E7FFB8"/>
  <circle cx="230" cy="360" r="4" fill="#E7FFB8"/>

  <!-- Peripheral dots -->
  <circle cx="180" cy="210" r="3" fill="#B6FF3B" fill-opacity="0.6"/>
  <circle cx="620" cy="280" r="3" fill="#B6FF3B" fill-opacity="0.6"/>
  <circle cx="370" cy="90" r="3" fill="#B6FF3B" fill-opacity="0.6"/>
  <circle cx="430" cy="410" r="3" fill="#B6FF3B" fill-opacity="0.6"/>

  <!-- HUD overlay text -->
  <text x="50" y="70" fill="#B6FF3B" font-family="monospace" font-size="13" font-weight="bold">KINETIX // PARTICLE PHYSICS</text>
  <text x="50" y="90" fill="#8E9590" font-family="monospace" font-size="11">Active Nodes: 1,200 · Engine: Canvas 2D Vector</text>

  <rect x="50" y="420" width="220" height="32" rx="16" fill="#141E16" stroke="#B6FF3B" stroke-opacity="0.3"/>
  <text x="75" y="441" fill="#B6FF3B" font-family="monospace" font-size="11">INTERACTIVE IN-MODAL DEMO</text>
</svg>
