<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#080A09"/>
  <!-- Ambient Pink Glow -->
  <circle cx="600" cy="180" r="240" fill="#EC4899" fill-opacity="0.12" filter="blur(90px)"/>
  <circle cx="200" cy="380" r="200" fill="#9333EA" fill-opacity="0.1" filter="blur(80px)"/>

  <!-- Neural Mesh Grid -->
  <defs>
    <pattern id="grid-synapse" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(236, 72, 153, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#grid-synapse)"/>

  <!-- Neural Nodes -->
  <circle cx="200" cy="220" r="8" fill="#EC4899"/>
  <circle cx="340" cy="150" r="6" fill="#F472B6"/>
  <circle cx="340" cy="290" r="6" fill="#F472B6"/>
  <circle cx="480" cy="180" r="10" fill="#EC4899"/>
  <circle cx="480" cy="260" r="8" fill="#EC4899"/>
  <circle cx="620" cy="220" r="12" fill="#B6FF3B"/>

  <line x1="200" y1="220" x2="340" y2="150" stroke="#EC4899" stroke-opacity="0.4" stroke-width="2"/>
  <line x1="200" y1="220" x2="340" y2="290" stroke="#EC4899" stroke-opacity="0.4" stroke-width="2"/>
  <line x1="340" y1="150" x2="480" y2="180" stroke="#EC4899" stroke-opacity="0.4" stroke-width="2"/>
  <line x1="340" y1="150" x2="480" y2="260" stroke="#EC4899" stroke-opacity="0.4" stroke-width="2"/>
  <line x1="340" y1="290" x2="480" y2="180" stroke="#EC4899" stroke-opacity="0.4" stroke-width="2"/>
  <line x1="340" y1="290" x2="480" y2="260" stroke="#EC4899" stroke-opacity="0.4" stroke-width="2"/>
  <line x1="480" y1="180" x2="620" y2="220" stroke="#B6FF3B" stroke-opacity="0.6" stroke-width="2"/>
  <line x1="480" y1="260" x2="620" y2="220" stroke="#B6FF3B" stroke-opacity="0.6" stroke-width="2"/>

  <!-- Title Card -->
  <rect x="50" y="50" width="300" height="90" rx="8" fill="#140E1B" stroke="#EC4899" stroke-opacity="0.3" stroke-width="1"/>
  <text x="70" y="85" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="20">SYNAPSE AI ENGINE</text>
  <text x="70" y="110" fill="#EC4899" font-family="monospace" font-size="11">MODEL INFERENCE ORCHESTRATION</text>
  <text x="70" y="125" fill="#9CA3AF" font-family="monospace" font-size="10">P99 Latency: 180ms · SOC2 Type II</text>

  <!-- Security Header Fallback Callout -->
  <rect x="50" y="380" width="460" height="60" rx="8" fill="#1A121D" stroke="rgba(236, 72, 153, 0.4)" stroke-width="1"/>
  <text x="70" y="405" fill="#F472B6" font-family="monospace" font-size="11" font-weight="bold">🛡️ STRICT ENTERPRISE CSP / X-FRAME-OPTIONS DETECTED</text>
  <text x="70" y="425" fill="#9CA3AF" font-family="sans-serif" font-size="11">Rendered with rich presentation gallery & verified architectural specs.</text>
</svg>
