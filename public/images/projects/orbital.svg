<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#080A09"/>
  <!-- Ambient Space Glow -->
  <circle cx="580" cy="250" r="280" fill="#9333EA" fill-opacity="0.15" filter="blur(90px)"/>
  <circle cx="200" cy="150" r="180" fill="#3B82F6" fill-opacity="0.1" filter="blur(70px)"/>
  
  <!-- Starfield dots -->
  <circle cx="120" cy="80" r="1.5" fill="#FFFFFF" fill-opacity="0.6"/>
  <circle cx="280" cy="140" r="1" fill="#FFFFFF" fill-opacity="0.4"/>
  <circle cx="680" cy="90" r="2" fill="#FFFFFF" fill-opacity="0.8"/>
  <circle cx="450" cy="60" r="1.5" fill="#FFFFFF" fill-opacity="0.5"/>
  <circle cx="720" cy="380" r="1" fill="#FFFFFF" fill-opacity="0.3"/>
  <circle cx="160" cy="390" r="1.5" fill="#FFFFFF" fill-opacity="0.7"/>

  <!-- Orbital Rings / HUD -->
  <ellipse cx="480" cy="260" rx="320" ry="140" stroke="#A855F7" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="6 4"/>
  <ellipse cx="480" cy="260" rx="220" ry="90" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1"/>
  <ellipse cx="480" cy="260" rx="120" ry="50" stroke="#B6FF3B" stroke-opacity="0.5" stroke-width="1.5"/>

  <!-- Satellite Node -->
  <circle cx="570" cy="225" r="7" fill="#B6FF3B"/>
  <circle cx="570" cy="225" r="16" stroke="#B6FF3B" stroke-opacity="0.5" stroke-width="1"/>
  <line x1="570" y1="225" x2="640" y2="160" stroke="#B6FF3B" stroke-width="1"/>
  <rect x="640" y="145" width="130" height="32" rx="4" fill="#13101E" stroke="#B6FF3B" stroke-width="1"/>
  <text x="650" y="165" fill="#B6FF3B" font-family="monospace" font-size="10" font-weight="bold">SAT-09 // LOCKED</text>

  <!-- Central Planet Sphere -->
  <circle cx="480" cy="260" r="50" fill="url(#planet-grad)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="2"/>
  
  <defs>
    <radialGradient id="planet-grad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="70%" stop-color="#0F0D22"/>
      <stop offset="100%" stop-color="#05030A"/>
    </radialGradient>
  </defs>

  <!-- Left Side Telemetry Card -->
  <rect x="50" y="80" width="280" height="340" rx="10" fill="#0F0C1B" fill-opacity="0.85" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1"/>
  <text x="75" y="120" fill="#E9D5FF" font-family="sans-serif" font-weight="bold" font-size="22">ORBITAL OS</text>
  <text x="75" y="145" fill="#A855F7" font-family="monospace" font-size="11">NEXT-GEN DEEP-SPACE TELEMETRY</text>
  
  <line x1="75" y1="165" x2="305" y2="165" stroke="rgba(255, 255, 255, 0.1)"/>

  <text x="75" y="195" fill="#94A3B8" font-family="monospace" font-size="11">ORBIT ALTITUDE</text>
  <text x="75" y="220" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="20">540.2 km LEO</text>

  <text x="75" y="260" fill="#94A3B8" font-family="monospace" font-size="11">ANTENNA CARRIER</text>
  <text x="75" y="285" fill="#38BDF8" font-family="sans-serif" font-weight="bold" font-size="18">Ka-Band 28.5 GHz</text>

  <text x="75" y="325" fill="#94A3B8" font-family="monospace" font-size="11">ORBIT INCLINATION</text>
  <text x="75" y="350" fill="#B6FF3B" font-family="sans-serif" font-weight="bold" font-size="18">53.0° Sun-Sync</text>

  <rect x="75" y="380" width="230" height="28" rx="6" fill="#1C1433" stroke="#A855F7" stroke-width="1"/>
  <text x="95" y="398" fill="#E9D5FF" font-family="monospace" font-size="10">● SYSTEM NOMINAL · 120 FPS</text>
</svg>
