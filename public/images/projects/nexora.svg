<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#080A09"/>
  <!-- Ambient glow -->
  <circle cx="200" cy="180" r="260" fill="#0284C7" fill-opacity="0.12" filter="blur(90px)"/>
  <circle cx="650" cy="350" r="220" fill="#B6FF3B" fill-opacity="0.08" filter="blur(80px)"/>
  
  <!-- Subtle tech grid -->
  <defs>
    <pattern id="grid-nexora" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(56, 189, 248, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#grid-nexora)"/>

  <!-- Browser Frame -->
  <rect x="40" y="40" width="720" height="420" rx="12" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1" fill="#0B0F12" fill-opacity="0.75"/>
  <rect x="40" y="40" width="720" height="42" rx="12" fill="#111822"/>
  <circle cx="68" cy="61" r="5" fill="#EF4444"/>
  <circle cx="86" cy="61" r="5" fill="#F59E0B"/>
  <circle cx="104" cy="61" r="5" fill="#10B981"/>
  <text x="130" y="65" fill="#64748B" font-family="monospace" font-size="12">https://app.nexora.io/clusters/global-live</text>
  <rect x="640" y="50" width="100" height="22" rx="11" fill="rgba(56, 189, 248, 0.15)" stroke="#38BDF8" stroke-width="1"/>
  <text x="655" y="65" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="bold">● LIVE 12ms</text>

  <!-- Metric Panels -->
  <!-- Panel 1 -->
  <rect x="65" y="105" width="200" height="90" rx="8" fill="#131B24" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="80" y="130" fill="#94A3B8" font-family="sans-serif" font-size="12">Global Ingestion</text>
  <text x="80" y="160" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="24">4.82 GB/s</text>
  <text x="80" y="180" fill="#38BDF8" font-family="monospace" font-size="11">+18.4% vs last hr</text>

  <!-- Panel 2 -->
  <rect x="280" y="105" width="200" height="90" rx="8" fill="#131B24" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="295" y="130" fill="#94A3B8" font-family="sans-serif" font-size="12">Cluster Nodes</text>
  <text x="295" y="160" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="24">1,420 Active</text>
  <text x="295" y="180" fill="#B6FF3B" font-family="monospace" font-size="11">● 100% Operational</text>

  <!-- Panel 3 -->
  <rect x="495" y="105" width="240" height="90" rx="8" fill="#131B24" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="510" y="130" fill="#94A3B8" font-family="sans-serif" font-size="12">Telemetry Latency</text>
  <text x="510" y="160" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="24">11.4 ms</text>
  <text x="510" y="180" fill="#38BDF8" font-family="monospace" font-size="11">P99: 18.2ms</text>

  <!-- Big Telemetry Chart -->
  <rect x="65" y="215" width="465" height="225" rx="10" fill="#101720" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1"/>
  <text x="85" y="245" fill="#E2E8F0" font-family="sans-serif" font-weight="600" font-size="14">Throughput Distribution · Real-time Stream</text>
  
  <!-- Wave Graph -->
  <path d="M 85 390 C 130 360, 160 410, 210 330 C 260 260, 300 370, 350 310 C 400 250, 440 320, 500 270" stroke="#38BDF8" stroke-width="3" fill="none"/>
  <path d="M 85 390 C 130 360, 160 410, 210 330 C 260 260, 300 370, 350 310 C 400 250, 440 320, 500 270 L 500 420 L 85 420 Z" fill="url(#blue-grad)" fill-opacity="0.15"/>
  
  <defs>
    <linearGradient id="blue-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#080A09"/>
    </linearGradient>
  </defs>

  <!-- Right Sidebar widgets -->
  <rect x="545" y="215" width="190" height="225" rx="10" fill="#101720" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="560" y="245" fill="#E2E8F0" font-family="sans-serif" font-weight="600" font-size="13">Regional Nodes</text>
  <text x="560" y="280" fill="#94A3B8" font-family="monospace" font-size="11">US-East (iad)</text>
  <rect x="560" y="290" width="160" height="5" rx="2" fill="#1E293B"/>
  <rect x="560" y="290" width="145" height="5" rx="2" fill="#38BDF8"/>
  
  <text x="560" y="325" fill="#94A3B8" font-family="monospace" font-size="11">EU-West (fra)</text>
  <rect x="560" y="335" width="160" height="5" rx="2" fill="#1E293B"/>
  <rect x="560" y="335" width="120" height="5" rx="2" fill="#B6FF3B"/>

  <text x="560" y="370" fill="#94A3B8" font-family="monospace" font-size="11">AP-East (tyo)</text>
  <rect x="560" y="380" width="160" height="5" rx="2" fill="#1E293B"/>
  <rect x="560" y="380" width="150" height="5" rx="2" fill="#38BDF8"/>
</svg>
